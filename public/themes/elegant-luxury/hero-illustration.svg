<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" fill="none">
  <defs>
    <radialGradient id="elBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2A2118"/>
      <stop offset="55%" stop-color="#14110D"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#9E7B23"/>
      <stop offset="80%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="900" fill="url(#elBg)"/>
  <circle cx="400" cy="380" r="320" fill="url(#goldGlow)"/>

  <!-- Art Deco Sunburst Rays -->
  <g stroke="url(#goldFoil)" stroke-width="1" opacity="0.32">
    <line x1="400" y1="360" x2="400" y2="40"/>
    <line x1="400" y1="360" x2="560" y2="70"/>
    <line x1="400" y1="360" x2="240" y2="70"/>
    <line x1="400" y1="360" x2="690" y2="160"/>
    <line x1="400" y1="360" x2="110" y2="160"/>
    <line x1="400" y1="360" x2="750" y2="290"/>
    <line x1="400" y1="360" x2="50" y2="290"/>
  </g>

  <!-- Double Octagonal & Cathedral Gilded Frame -->
  <path d="M130 840 V340 A270 270 0 0 1 670 340 V840 Z" stroke="url(#goldFoil)" stroke-width="3" fill="rgba(18,14,11,0.55)"/>
  <path d="M150 822 V345 A250 250 0 0 1 650 345 V822 Z" stroke="url(#goldFoil)" stroke-width="1.2" stroke-dasharray="6 4" fill="none"/>
  <polygon points="400,48 422,82 400,116 378,82" fill="url(#goldFoil)"/>

  <!-- Grand Chandelier Drops at Top Arch -->
  <g stroke="url(#goldFoil)" fill="none" stroke-width="1.5">
    <path d="M310 120 Q400 185 490 120"/>
    <path d="M270 155 Q400 240 530 155"/>
    <circle cx="400" cy="175" r="5" fill="#FFF3C4"/>
    <circle cx="340" cy="155" r="3.5" fill="#D4AF37"/>
    <circle cx="460" cy="155" r="3.5" fill="#D4AF37"/>
    <polygon points="400,205 408,222 400,239 392,222" fill="url(#goldFoil)"/>
  </g>

  <!-- Gold Stardust Bokeh -->
  <g fill="#FFF3C4">
    <circle cx="220" cy="240" r="3" opacity="0.8"/>
    <circle cx="585" cy="230" r="2.5" opacity="0.7"/>
    <circle cx="250" cy="430" r="2" opacity="0.5"/>
    <circle cx="555" cy="410" r="3.5" opacity="0.6"/>
    <circle cx="195" cy="590" r="2.5" opacity="0.6"/>
    <circle cx="610" cy="570" r="2" opacity="0.7"/>
  </g>

  <!-- Haute Couture Couple Silhouette & Gold Line Art -->
  <!-- Groom (Tuxedo & Bowtie) -->
  <g transform="translate(0, 20)">
    <circle cx="355" cy="315" r="32" fill="#1D1813" stroke="url(#goldFoil)" stroke-width="2.2"/>
    <path d="M332 302 C338 280 374 282 382 304" stroke="url(#goldFoil)" stroke-width="1.8" fill="none"/>
    <!-- Tuxedo Shoulders & Jacket -->
    <path d="M285 730 L300 410 C302 380 322 365 355 365 C388 365 405 382 408 412 L416 730 Z" fill="#120F0C" stroke="url(#goldFoil)" stroke-width="2.2"/>
    <!-- White Dress Shirt V & Gold Bowtie -->
    <polygon points="338,366 372,366 355,445" fill="#FAF6F0" stroke="url(#goldFoil)" stroke-width="1.5"/>
    <polygon points="343,374 355,380 343,386" fill="url(#goldFoil)"/>
    <polygon points="367,374 355,380 367,386" fill="url(#goldFoil)"/>
    <!-- Lapels -->
    <path d="M336 366 L324 435 L355 452 L386 435 L374 366" stroke="url(#goldFoil)" stroke-width="1.5" fill="none"/>

    <!-- Bride (Couture Gown & Cathedral Veil) -->
    <circle cx="452" cy="332" r="29" fill="#231D16" stroke="url(#goldFoil)" stroke-width="2.2"/>
    <!-- Crown Tiara -->
    <path d="M432 308 L442 294 L452 304 L462 294 L472 308 Z" fill="url(#goldFoil)"/>
    <!-- Flowing Cathedral Veil -->
    <path d="M468 318 C525 360 585 520 620 735 L485 735" fill="rgba(243,229,171,0.09)" stroke="url(#goldFoil)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Couture Mermaid/Ball Gown -->
    <path d="M418 405 C428 382 475 382 485 405 L505 510 C535 600 575 685 600 735 L365 735 C388 670 412 585 422 505 Z" fill="url(#goldFoil)" fill-opacity="0.18" stroke="url(#goldFoil)" stroke-width="2.4"/>
    <!-- Gold Filigree Lace Details on Gown -->
    <path d="M405 685 Q460 655 555 695" stroke="url(#goldFoil)" stroke-width="1.5" fill="none"/>
    <path d="M385 715 Q465 685 580 720" stroke="url(#goldFoil)" stroke-width="1.5" fill="none"/>
    <!-- Joined Hands Glow -->
    <circle cx="412" cy="485" r="14" fill="url(#goldGlow)"/>
    <circle cx="412" cy="485" r="4" fill="#FFF3C4"/>
  </g>

  <!-- Art Deco Pedestal & Corner Geometry -->
  <path d="M180 760 H620" stroke="url(#goldFoil)" stroke-width="2"/>
  <path d="M220 778 H580" stroke="url(#goldFoil)" stroke-width="1"/>
  <polygon points="400,748 412,760 400,772 388,760" fill="url(#goldFoil)"/>
</svg>